name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (Optimized & Fast)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # Exclude heavy binary 3D models and uncompressed raw media to speed up deploy
          pattern: |
            !**/*.glb
            !**/*.fbx
            !**/*.psd
            !**/.tmp.driveupload/**

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
