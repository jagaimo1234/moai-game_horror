name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create Web Deployment Directory
        run: |
          mkdir -p _public
          cp -r pos.html index.html data.js images _public/ 2>/dev/null || true
          if [ -f favicon.ico ]; then cp favicon.ico _public/; fi

      - name: Upload artifact (Ultra Lightweight - Only Web Assets)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
